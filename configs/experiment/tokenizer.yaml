# @package experiment
# Trainer settings of the tokenizer recipe (per-GPU batch 48; the released run used 112 GPUs -> 5376 per step).
num_nodes: 1
num_devices: 8
ddp_timeout_min: 60
ddp:
  find_unused_parameters: true
  comm_hook: bf16

training:
  precision: bf16-mixed
  compile: true
  batch_size: 48
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  max_steps: 200000
  log_every_n_steps: 10
  checkpointing:
    every_n_train_steps: 2000

validation:
  batch_size: 48
  val_every_n_step: 5000
  limit_batch: 16
